# Example only. Do not commit real values; create the secret with
#   kubectl -n monitoring create secret generic alert-copilot --from-env-file=.env
# or manage it with External Secrets / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: alert-copilot
  namespace: monitoring
type: Opaque
stringData:
  WEBHOOK_TOKEN: "replace-with-a-long-random-string"
  ANTHROPIC_API_KEY: "replace-with-your-anthropic-api-key"
  TELEGRAM_BOT_TOKEN: "123456789:replace-with-your-bot-token"
  TELEGRAM_CHAT_ID: "-1001234567890"
  # SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
